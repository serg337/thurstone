name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Clean install
        run: npm ci --no-fund --audit=false
      - name: Verify dependency tree
        run: npm run install:check
      - name: Verify complete third-party inventory
        run: npm run verify:third-party
      - name: Audit full dependency tree
        run: npm audit --audit-level=high
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check strict types
        run: npm run typecheck
      - name: Run deterministic tests
        run: npm run test
      - name: Verify Gate 7 adversarial matrix
        run: npm run gate7:verify-adversarial
      - name: Verify Direct Site Tools evidence
        run: npm run verify:direct-site-tools
      - name: Build production app
        run: npm run build
      - name: Verify blinded Probe client boundary
        run: npm run verify:probe-no-leakage
      - name: Verify publication boundary
        run: npm run verify:publication

  browser-safe:
    name: Safe browser and accessibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Clean install
        run: npm ci --no-fund --audit=false
      - name: Install ordinary test browser
        run: npx playwright install --with-deps chromium
      - name: Run non-native, non-model browser checks
        run: npm run test:browser:safe
      - name: Preserve failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Complete-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan reachable history
        run: |
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
